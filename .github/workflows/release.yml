name: ci-release

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n ratsweepr.sh
      - name: Validate YARA ruleset compiles
        run: |
          ver=v1.19.0
          url="https://github.com/VirusTotal/yara-x/releases/download/$ver/yara-x-$ver-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" | tar -xz yr && chmod +x yr
          ./yr scan ratsweepr.yar /dev/null && echo "rules compile OK"

  release:
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ratsweepr.sh
            ratsweepr.yar
            ratsweepr-sigs.conf
          generate_release_notes: true
